<script>
const TITLE="El jardín que solo crecía con preguntas";
const STORY="En la ciudad de Venturia había un jardín cerrado desde hacía más de cien años.\n\nSe encontraba detrás del antiguo ayuntamiento, rodeado por una tapia tan alta que nadie podía ver lo que había dentro. Sobre la puerta de hierro aparecía una frase grabada:\n\nSOLO ENTRA QUIEN SE ATREVE A PREGUNTAR.\n\nLa mayoría de los habitantes pasaba delante sin prestar atención. Algunos pensaban que era una frase decorativa. Otros aseguraban que el jardín estaba abandonado y que no había nada interesante tras la puerta.\n\nPero Mara, de doce años, sentía curiosidad.\n\nVivía con su padre y su hermano pequeño en una casa cercana a la plaza. Le gustaba observar, investigar y buscar explicaciones. Si veía una fila de hormigas, se preguntaba cómo encontraban el camino. Si una nube cambiaba de forma, quería saber por qué. Si un reloj se detenía, intentaba descubrir qué pieza había fallado.\n\nEn el colegio, sin embargo, no siempre hacía preguntas.\n\nSu profesor de Ciencias, don Leandro, había dicho una vez:\n\n—Preguntar es una forma de aprender.\n\nPero algunos compañeros se reían cuando Mara levantaba la mano.\n\n—Siempre quiere saberlo todo —decían.\n\nPor eso había comenzado a guardar muchas preguntas para sí misma.\n\nSu mejor amigo se llamaba Joel. Era tranquilo, cuidadoso y prefería no destacar. Le gustaban los mapas y podía pasar horas dibujando calles imaginarias.\n\nUna tarde, Mara lo llevó hasta la puerta del jardín.\n\n—Quiero entrar.\n\nJoel leyó la inscripción.\n\n—Está cerrado.\n\n—La frase dice que entra quien se atreve a preguntar.\n\n—Eso no significa que la puerta vaya a abrirse.\n\nMara apoyó una mano sobre el hierro.\n\n—¿Qué hay detrás?\n\nLa cerradura emitió un clic.\n\nJoel retrocedió.\n\nLa puerta se abrió lentamente.\n\nAl otro lado había un camino de piedra cubierto de musgo. A ambos lados crecían plantas extrañas. Algunas tenían hojas azules. Otras parecían hechas de cristal. Había flores que se cerraban cuando alguien las miraba y arbustos que cambiaban de tamaño según soplaba el viento.\n\n—Esto no estaba abandonado —murmuró Joel.\n\nEntraron.\n\nLa puerta se cerró detrás de ellos.\n\nMara intentó abrirla, pero no se movió.\n\n—No te preocupes —dijo—. Seguro que hay otra salida.\n\n—Eso dices siempre justo antes de meternos en problemas.\n\nEl sendero conducía hasta una fuente seca. En el centro había una estatua de una mujer sosteniendo un libro.\n\nAl acercarse, la estatua abrió los ojos.\n\n—Bienvenidos al Jardín de las Preguntas —dijo.\n\nJoel dejó caer su cuaderno.\n\n—Las estatuas no hablan.\n\n—Esa no es una pregunta —respondió la figura.\n\nMara se inclinó hacia delante.\n\n—¿Quién eres?\n\nLa piedra comenzó a adquirir color. La estatua se transformó en una mujer de cabello gris y túnica verde.\n\n—Me llamo Leria. Soy la guardiana.\n\n—¿Por qué está cerrado el jardín?\n\n—Porque dejó de recibir preguntas.\n\nLeria explicó que aquel lugar había sido creado por antiguos investigadores de Venturia. Cada vez que alguien formulaba una pregunta sincera, nacía una semilla. Si la persona buscaba una respuesta con paciencia, la semilla crecía.\n\n—¿Todas las plantas vienen de preguntas? —preguntó Mara.\n\n—Sí.\n\nLa guardiana señaló una flor dorada.\n\n—Esa nació cuando una niña preguntó por qué las estrellas parecían tan pequeñas.\n\nDespués mostró un árbol de hojas plateadas.\n\n—Ese surgió cuando un médico quiso saber cómo aliviar una enfermedad.\n\nJoel observó una planta marchita.\n\n—¿Y esa?\n\n—Nació de una pregunta que fue abandonada antes de investigarse.\n\nMara miró alrededor.\n\nHabía muchas plantas secas.\n\n—¿Qué ha ocurrido?\n\n—Los habitantes dejaron de preguntar. Comenzaron a aceptar respuestas rápidas, aunque fueran incorrectas. Otros tuvieron miedo de parecer ignorantes.\n\nUn ruido sacudió el jardín.\n\nLas ramas temblaron.\n\nDesde el fondo llegó una nube oscura que avanzaba pegada al suelo. A su paso, las flores se cerraban y las hojas perdían color.\n\n—¿Qué es eso? —preguntó Joel.\n\n—La Duda Vacía —respondió Leria—. No es la duda que ayuda a pensar. Es la que repite que no merece la pena intentarlo.\n\nLa nube se detuvo frente a ellos.\n\nDe su interior surgieron voces.\n\n—No vas a entenderlo.\n\n—Tu pregunta es ridícula.\n\n—Otros saben más.\n\n—Es mejor quedarse callado.\n\nMara reconoció algunas de aquellas frases. Las había escuchado en clase. Otras se las había dicho ella misma.\n\nLeria abrió el libro que llevaba.\n\n—La Duda Vacía está creciendo. Si llega al Árbol de las Respuestas, el jardín desaparecerá.\n\n—¿Dónde está ese árbol? —preguntó Mara.\n\n—En el centro. Pero solo puede alcanzarse siguiendo el Camino de las Buenas Preguntas.\n\nLa guardiana les entregó una brújula sin aguja.\n\n—No señala el norte. Señala aquello que todavía no comprendéis.\n\n—Eso podría ser cualquier dirección —dijo Joel.\n\nLa brújula giró y apuntó hacia un sendero estrecho.\n\nComenzaron a caminar.\n\nLa primera zona era un campo lleno de puertas. Había cientos, todas de colores distintos. Algunas eran pequeñas. Otras se elevaban varios metros.\n\nSobre una piedra se leía:\n\nUNA PREGUNTA DEMASIADO AMPLIA ABRE DEMASIADOS CAMINOS.\n\nLa brújula giraba sin detenerse.\n\nMara eligió una puerta roja.\n\n—¿Qué hay detrás?\n\nLa puerta se abrió y apareció un pasillo con miles de salidas.\n\n—No podemos revisar todo eso —dijo Joel.\n\nRegresaron.\n\n—Necesitamos una pregunta más concreta —comprendió Mara.\n\nObservó las puertas. Una tenía marcas de barro.\n\n—¿Por qué esta puerta tiene barro si las demás están limpias?\n\nLa puerta se abrió.\n\nDetrás había un único camino.\n\n—Una buena pregunta se fija en los detalles —dijo Joel.\n\nCruzaron.\n\nLa segunda zona era un estanque cubierto de niebla. En la orilla había una barca sin remos.\n\nUna voz salió del agua:\n\n—Para cruzar, debéis responder: ¿por qué está enfermo el estanque?\n\nMara miró el agua. Estaba oscura.\n\n—Porque está contaminado.\n\nNo ocurrió nada.\n\n—Puede ser —dijo Joel—, pero no tenemos pruebas.\n\nObservaron mejor.\n\nNo había peces muertos ni basura. Las plantas de la orilla parecían sanas. Joel acercó la mano al agua.\n\n—Está muy caliente.\n\nMara señaló unas piedras agrietadas.\n\n—¿De dónde viene el calor?\n\nLa niebla se apartó y dejó ver una tubería bajo la superficie.\n\nLa tubería vertía agua caliente.\n\n—El estanque no estaba contaminado —dijo Mara—. Su temperatura había cambiado.\n\nLa barca recibió dos remos.\n\nMientras cruzaban, Leria apareció reflejada en el agua.\n\n—Una respuesta rápida puede parecer correcta. Pero una buena pregunta exige observar antes de decidir.\n\nAl llegar a la otra orilla, la Duda Vacía se acercó. Sus voces sonaron más fuertes.\n\n—Habéis tenido suerte.\n\n—La próxima vez fallaréis.\n\n—No sois lo bastante inteligentes.\n\nJoel bajó la cabeza.\n\n—Tal vez tengan razón.\n\nMara lo miró.\n\n—¿Por qué lo dices?\n\n—Porque tú haces casi todas las preguntas.\n\n—Pero tú descubriste que el agua estaba caliente.\n\nLa nube retrocedió ligeramente.\n\nJoel levantó la brújula.\n\n—¿Por qué la Duda Vacía se debilita cuando reconocemos lo que hacemos bien?\n\nLa brújula brilló.\n\nEl siguiente sendero apareció.\n\nLlegaron a un laberinto de espejos. Cada espejo mostraba una respuesta escrita:\n\nPorque sí.\n\nTodo el mundo lo sabe.\n\nSiempre ha sido así.\n\nLo vi en algún sitio.\n\nMe lo contó alguien.\n\nEn el centro se escuchaba un tic-tac.\n\n—Tenemos que encontrar la salida —dijo Joel.\n\nMara observó las frases.\n\n—Quizá debamos elegir la respuesta correcta.\n\n—No conocemos la pregunta.\n\nEntonces Mara recordó la inscripción del jardín.\n\n—Primero debemos preguntar.\n\nAlzó la voz:\n\n—¿Qué estamos intentando averiguar?\n\nLos espejos temblaron.\n\nUna frase apareció en el suelo:\n\n¿POR QUÉ SE ESCUCHA UN RELOJ SI NO HAY NINGUNO A LA VISTA?\n\nJoel examinó los espejos.\n\n—Puede estar detrás de alguno.\n\nGolpearon suavemente cada superficie. Casi todas sonaban sólidas. Una produjo un eco hueco.\n\nMara formuló otra pregunta:\n\n—¿Qué diferencia a este espejo de los demás?\n\nVieron que estaba ligeramente empañado.\n\nLo apartaron.\n\nDetrás había un reloj y una salida.\n\n—Las preguntas sirven para comparar —dijo Joel.\n\nAl abandonar el laberinto, encontraron una sala con estanterías. Miles de libros llenaban las paredes. En el centro, un anciano escribía sobre una mesa.\n\n—Soy el Archivista —dijo sin levantar la cabeza—. Solo podéis continuar si encontráis una afirmación falsa.\n\nLes entregó tres tarjetas:\n\nLas abejas se comunican mediante movimientos.\n\nLa Luna produce su propia luz.\n\nAlgunos árboles pueden vivir miles de años.\n\nMara señaló la segunda.\n\n—La Luna no produce luz. Refleja la del Sol.\n\nEl anciano cerró el libro.\n\n—¿Cómo lo sabes?\n\nMara abrió la boca, pero se detuvo.\n\nLo había aprendido en clase. Sin embargo, el Archivista no preguntaba solo por la respuesta.\n\n—Lo explicó don Leandro.\n\n—Eso indica quién te lo dijo, no por qué es cierto.\n\nJoel buscó en las estanterías. Encontró un libro de astronomía.\n\nMara leyó que la superficie lunar reflejaba parte de la luz solar. Después hallaron un dibujo de las fases de la Luna y una explicación de los eclipses.\n\n—Podemos comprobarlo con diferentes fuentes —dijo.\n\nEl Archivista sonrió.\n\n—Una respuesta se vuelve más firme cuando puede apoyarse en pruebas.\n\nLes entregó una semilla transparente.\n\n—Plantadla cuando lleguéis al centro.\n\nContinuaron.\n\nLa Duda Vacía había crecido hasta cubrir gran parte del cielo. Las plantas se doblaban bajo su sombra.\n\nMara y Joel llegaron a un puente suspendido sobre un barranco. Faltaban varias tablas.\n\nEn el otro extremo había un cartel:\n\nNO TODAS LAS PREGUNTAS TIENEN UNA ÚNICA RESPUESTA.\n\n—¿Cómo cruzamos? —preguntó Mara.\n\nUna tabla apareció.\n\n—¿Qué materiales podríamos utilizar para completar el puente? —añadió Joel.\n\nAparecieron cuerdas, ramas y tablones.\n\n—¿Qué opción sería más segura?\n\nSe formó otra tabla.\n\nSiguieron preguntando.\n\n—¿Cuánto peso soporta cada cuerda?\n\n—¿Podemos cruzar de uno en uno?\n\n—¿Hay otra ruta?\n\nCon cada pregunta aparecía una parte del paso.\n\nCuando estuvieron a mitad del puente, la nube habló.\n\n—Nunca sabréis si habéis elegido la mejor solución.\n\nMara se detuvo.\n\nEra cierto.\n\nPodían construir el puente de muchas formas. No podían probarlas todas.\n\n—No necesitamos la solución perfecta —dijo Joel—. Necesitamos una solución segura basada en lo que sabemos.\n\nEl puente quedó completo.\n\nAl otro lado encontraron un bosque. Los árboles tenían hojas en forma de signos de interrogación.\n\nLa brújula comenzó a girar rápidamente.\n\n—Aquí hay demasiadas cosas que no comprendemos —dijo Mara.\n\nEntonces escucharon un llanto.\n\nSiguieron el sonido hasta encontrar una criatura pequeña atrapada entre raíces. Parecía un zorro, pero tenía seis patas y orejas de color violeta.\n\nMara se acercó.\n\n—¿Qué animal es?\n\nLa brújula no reaccionó.\n\nJoel observó la trampa.\n\n—¿Cómo podemos liberarlo sin hacerle daño?\n\nLa brújula brilló.\n\n—Esa es la pregunta importante ahora —comprendió Mara.\n\nExaminaron las raíces. Una estaba presionando una pata. No podían tirar de ella sin lastimar al animal.\n\nJoel utilizó una rama como palanca mientras Mara apartaba la tierra. Consiguieron abrir un hueco.\n\nLa criatura escapó y se internó en el bosque.\n\nLeria apareció entre los árboles.\n\n—Una pregunta puede ser interesante y, aun así, no ser la más necesaria.\n\n—Yo quería saber qué clase de animal era —admitió Mara.\n\n—Y quizá algún día puedas investigarlo. Pero primero necesitaba ayuda.\n\nEl sendero final los llevó a una colina.\n\nEn la cima se levantaba el Árbol de las Respuestas.\n\nEra gigantesco. Sus raíces recorrían todo el jardín y sus ramas sostenían frutos de muchos colores. Cada fruto contenía una respuesta descubierta por alguien.\n\nSin embargo, las hojas estaban cayendo.\n\nLa Duda Vacía rodeaba el tronco.\n\n—Habéis llegado tarde —dijo con cientos de voces.\n\nLeria apareció junto al árbol.\n\n—Aún podéis salvarlo. Plantad la semilla.\n\nMara hizo un agujero junto a una raíz y colocó la semilla transparente.\n\nNo ocurrió nada.\n\n—¿Qué necesita para crecer? —preguntó Joel.\n\nLa semilla emitió una luz débil.\n\n—Agua —dijo Mara.\n\nVertieron el contenido de una cantimplora.\n\nNada cambió.\n\n—Quizá no necesita agua normal —dijo Joel.\n\nRecordaron que las plantas del jardín nacían de preguntas.\n\nMara se arrodilló.\n\n—¿Por qué tenemos miedo de preguntar?\n\nLa semilla abrió una pequeña grieta.\n\nJoel añadió:\n\n—¿Qué perdemos cuando fingimos entender algo?\n\nSurgió un brote.\n\nLa Duda Vacía rugió.\n\n—Os tomarán por ignorantes.\n\nMara levantó la voz.\n\n—¿No es más ignorante quien no quiere aprender?\n\nEl brote creció.\n\n—Os equivocaréis.\n\n—¿Qué podemos aprender de un error? —preguntó Joel.\n\nLa planta alcanzó la altura de un arbusto.\n\nLas voces intentaron detenerlos.\n\n—Nunca encontraréis todas las respuestas.\n\nMara miró el árbol.\n\n—¿Es necesario conocer todas las respuestas para seguir buscando?\n\nLa nueva planta se convirtió en un árbol joven.\n\nSus ramas emitieron una luz clara que atravesó la nube.\n\nLa Duda Vacía se encogió.\n\n—Las preguntas crean incertidumbre —susurró.\n\n—Sí —respondió Mara—. Pero también crean caminos.\n\nLa nube se redujo hasta convertirse en una esfera oscura del tamaño de una manzana.\n\nLeria la recogió y la guardó en una caja.\n\n—¿No vas a destruirla? —preguntó Joel.\n\n—No. Un poco de duda es útil. Nos obliga a revisar las respuestas. El problema aparece cuando la duda solo sirve para impedirnos actuar.\n\nEl Árbol de las Respuestas recuperó sus hojas.\n\nUn fruto cayó frente a Mara. Dentro se veía una imagen de su clase. Ella levantaba la mano mientras varios compañeros se reían.\n\nOtro fruto cayó ante Joel. Mostraba un mapa incompleto.\n\n—¿Son respuestas? —preguntó él.\n\n—No —dijo Leria—. Son próximas preguntas.\n\nLa guardiana les explicó que el jardín no necesitaba personas que preguntaran por todo sin escuchar. Tampoco buscaba respuestas rápidas.\n\n—Necesita curiosidad, paciencia y responsabilidad.\n\nMara miró la puerta lejana.\n\n—¿Podremos volver?\n\n—Siempre que traigáis una pregunta sincera.\n\nAntes de marcharse, Leria les entregó una bolsa con semillas pequeñas.\n\n—Plantadlas donde las personas hayan dejado de preguntar.\n\nAl día siguiente, en clase, don Leandro explicó cómo se formaban las montañas. Mara no comprendió una parte.\n\nSintió el impulso de callarse.\n\nEscuchó en su cabeza las voces de la Duda Vacía.\n\nTodos los demás lo entienden.\n\nTu pregunta es absurda.\n\nMiró a Joel.\n\nÉl levantó la mano primero.\n\n—¿Cómo saben los científicos que esas placas se mueven si lo hacen tan despacio?\n\nDon Leandro sonrió y comenzó a explicarlo.\n\nMara levantó la mano después.\n\n—¿Qué pruebas permiten medir ese movimiento?\n\nNadie se rio.\n\nUna compañera añadió otra pregunta. Después otro alumno formuló una más.\n\nLa clase se convirtió en una conversación.\n\nSemanas después, Mara y Joel crearon un mural titulado Preguntas que queremos investigar. Los alumnos podían pegar notas.\n\nAparecieron preguntas sobre animales, planetas, historia, máquinas y emociones.\n\n—¿Por qué soñamos?\n\n—¿Cómo encuentran las aves el camino?\n\n—¿Por qué algunas personas tienen miedo de hablar en público?\n\n—¿Se puede limpiar el agua del mar para beberla?\n\nDon Leandro les ayudó a investigar algunas. Para otras no encontraron respuestas claras.\n\nAprendieron a escribir:\n\nTodavía no lo sabemos.\n\nMara descubrió que aquella frase no era una derrota. Era el principio de una búsqueda.\n\nJoel dibujó un mapa del colegio y marcó lugares donde podían investigar: la biblioteca, el laboratorio, el patio y el huerto.\n\nUn día encontraron una planta desconocida junto a la valla.\n\nMara estuvo a punto de arrancarla para llevarla a clase.\n\nJoel la detuvo.\n\n—¿Podemos estudiarla sin dañarla?\n\nTomaron fotografías, midieron sus hojas y buscaron información. Descubrieron que era una especie poco común en la zona.\n\nLa pregunta había cambiado su forma de actuar.\n\nCon el tiempo, otros alumnos comenzaron a preguntar sin vergüenza.\n\nTambién aprendieron que no todas las preguntas eran adecuadas en cualquier momento. Algunas podían herir, invadir la intimidad o distraer de un problema urgente.\n\nDon Leandro escribió tres reglas en la pared:\n\nPregunta para comprender, no para presumir.\n\nEscucha antes de volver a preguntar.\n\nBusca pruebas antes de aceptar una respuesta.\n\nMara guardó una de las semillas de Leria en un tarro. No crecía con agua ni con luz.\n\nUn sábado invitó a su hermano pequeño a observarla.\n\n—¿Por qué no crece? —preguntó él.\n\nLa semilla se abrió.\n\nUna raíz diminuta apareció en la tierra.\n\nMara sonrió.\n\nMeses después, regresó con Joel al jardín.\n\nLa puerta se abrió cuando formularon una nueva pregunta:\n\n—¿Cómo ha cambiado este lugar desde nuestra última visita?\n\nDentro encontraron senderos nuevos. Las plantas marchitas comenzaban a recuperarse. Algunas preguntas del mural escolar se habían transformado en flores.\n\nEl Árbol de las Respuestas seguía en el centro, pero junto a él crecía el árbol joven que ellos habían plantado.\n\nEn una placa podía leerse:\n\nÁRBOL DE LAS PREGUNTAS QUE AÚN NO TIENEN RESPUESTA.\n\nEra más pequeño, pero sus raíces se extendían con fuerza.\n\n—¿Cuál de los dos es más importante? —preguntó Joel.\n\nLeria apareció tras ellos.\n\n—¿Qué pensáis vosotros?\n\nMara observó ambos árboles.\n\nEl primero guardaba conocimientos conseguidos con esfuerzo.\n\nEl segundo recordaba todo lo que faltaba por descubrir.\n\n—Se necesitan mutuamente —dijo—. Las respuestas permiten avanzar, pero las nuevas preguntas evitan que dejemos de aprender.\n\nLa guardiana asintió.\n\nMara comprendió entonces que no era necesario saberlo todo para ser inteligente.\n\nLa verdadera inteligencia comenzaba al reconocer lo que uno no sabía, formular buenas preguntas y buscar respuestas con paciencia.\n\nAntes de salir, escribió una frase en su cuaderno:\n\nNo preguntamos porque seamos ignorantes. Preguntamos porque queremos dejar de serlo.\n\nLa puerta del jardín se cerró.\n\nPero aquella vez Mara no sintió que el misterio hubiera terminado.\n\nSabía que cada respuesta podía abrir una nueva puerta.\n\nY ya no tenía miedo de llamar.";

const LABELS={"lectura": "Lectura", "comprension": "Comprensión", "vocabulario": "Vocabulario", "sinonimos": "Sinónimos", "alfabetico": "Orden alfabético", "contexto": "En contexto", "resultados": "Resultados"};
const sections=['lectura','comprension','vocabulario','sinonimos','alfabetico','contexto','resultados'];
const KEY='app_'+TITLE.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\W+/g,'_').toLowerCase();
function initState(){return {student:'',section:'lectura',idx:0,sec:Object.fromEntries(Object.keys(DATA).map(k=>[k,{a:Array(DATA[k].length).fill(''),c:Array(DATA[k].length).fill(false),order:Array(DATA[k].length).fill(null)}]))}}
let state; try{state=JSON.parse(localStorage.getItem(KEY))||initState()}catch(e){state=initState()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(arr){let a=[...arr]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a}
function buildNav(){document.getElementById('nav').innerHTML=sections.map(s=>`<button data-sec="${s}" class="${state.section===s?'active':''}">${LABELS[s]}</button>`).join(''); document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{state.section=b.dataset.sec;state.idx=0;save();render()}))}
function score(){let total=0,done=0,ok=0; Object.keys(DATA).forEach(k=>DATA[k].forEach((q,i)=>{total++; if(state.sec[k].c[i]){done++; if(state.sec[k].a[i]===q[1])ok++}})); return {total,done,ok,bad:done-ok,pct:done?Math.round(ok*100/done):0}}
function reading(){return `<section class="panel"><h2>Lectura</h2><div class="reading">${esc(STORY)}</div><div class="moraleja"><strong>Moraleja:</strong><br>${esc(MORALEJA)}</div></section>`}
function question(sec){let arr=DATA[sec], i=state.idx, q=arr[i], s=state.sec[sec]; if(!s.order[i]){s.order[i]=shuffle(q.slice(1)); save()} let opts=s.order[i]; let ans=s.a[i], checked=s.c[i]; return `<section class="panel"><h2>${LABELS[sec]}</h2><p><strong>Actividad ${i+1} de ${arr.length}</strong></p><div class="cardq"><h3>${esc(q[0])}</h3><div class="options">${opts.map(o=>`<button class="opt ${ans===o?'selected':''} ${checked&&o===q[1]?'correct':''} ${checked&&ans===o&&o!==q[1]?'wrong':''}" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="feedback ${checked?(ans===q[1]?'ok':'bad'):''}">${checked?(ans===q[1]?'Correcto.':'Incorrecto. Respuesta correcta: '+esc(q[1])):'Selecciona una respuesta y pulsa Comprobar.'}</div></div><div class="controls"><button class="btn" id="prev" ${i===0?'disabled':''}>Anterior</button><button class="btn primary" id="check">Comprobar</button><button class="btn" id="next" ${i===arr.length-1?'disabled':''}>Siguiente</button></div></section>`}
function resultsText(){
  let r=score();
  let t=TITLE+"\nAlumno/a: "+(state.student||'Sin identificar')+"\nAciertos: "+r.ok+" Errores: "+r.bad+" Porcentaje: "+r.pct+"%\n\n";
  Object.keys(DATA).forEach(k=>{
    t+=LABELS[k].toUpperCase()+"\n";
    DATA[k].forEach((q,i)=>{
      t+=(i+1)+'. '+q[0]+"\nRespuesta: "+(state.sec[k].a[i]||'Sin responder')+"\nCorrecta: "+q[1]+"\nComprobado: "+(state.sec[k].c[i]?'Sí':'No')+"\n\n";
    });
  });
  return t;
}
function results(){let r=score(); return `<section class="panel"><h2>Resultados</h2><div class="stats"><div class="stat"><div>Aciertos</div><div class="big">${r.ok}</div></div><div class="stat"><div>Errores</div><div class="big">${r.bad}</div></div><div class="stat"><div>Comprobadas</div><div class="big">${r.done}/${r.total}</div></div><div class="stat"><div>Porcentaje</div><div class="big">${r.pct}%</div></div></div><textarea readonly>${esc(resultsText())}</textarea><div class="controls no-print"><button class="btn primary" id="exportHtml">Exportar HTML</button><button class="btn" id="exportTxt">Exportar TXT</button><button class="btn" id="print">Imprimir</button></div></section>`}
function download(name,content,type){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
function render(){document.getElementById('student').value=state.student||''; buildNav(); let app=document.getElementById('app'); app.innerHTML=state.section==='lectura'?reading():state.section==='resultados'?results():question(state.section); if(DATA[state.section]){app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{state.sec[state.section].a[state.idx]=b.dataset.opt;save();render()})); let p=app.querySelector('#prev'),n=app.querySelector('#next'),c=app.querySelector('#check'); if(p)p.addEventListener('click',()=>{state.idx=Math.max(0,state.idx-1);save();render()}); if(n)n.addEventListener('click',()=>{state.idx=Math.min(DATA[state.section].length-1,state.idx+1);save();render()}); if(c)c.addEventListener('click',()=>{if(!state.sec[state.section].a[state.idx]){alert('Selecciona una respuesta.');return} state.sec[state.section].c[state.idx]=true;save();render()})} if(state.section==='resultados'){document.getElementById('print').addEventListener('click',()=>window.print()); document.getElementById('exportTxt').addEventListener('click',()=>download('resultados_'+TITLE+'.txt',resultsText(),'text/plain')); document.getElementById('exportHtml').addEventListener('click',()=>download('resultados_'+TITLE+'.html','<!doctype html><meta charset="utf-8"><title>Resultados</title><pre>'+esc(resultsText())+'</pre>','text/html'))}}
document.getElementById('saveName').addEventListener('click',()=>{state.student=document.getElementById('student').value.trim();save();render()}); document.getElementById('reset').addEventListener('click',()=>{if(confirm('¿Reiniciar todos los resultados?')){state=initState();save();render()}}); render();
